<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1e50"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen"/>
  <meta name="apple-mobile-web-app-title" content="SchoolGame"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <title>Mahtabrai Open World</title>
  <link rel="stylesheet" href="src/style.css"/>
</head>
<body>
  <!-- LOADING -->
  <div id="loading">
    <div class="ld-inner">
      <div class="ld-logo">🎮</div>
      <h1>MAHTABRAI<br><span>OPEN WORLD</span></h1>
      <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
      <p id="ld-text">Initializing…</p>
    </div>
  </div>

  <!-- CANVAS -->
  <canvas id="c"></canvas>

  <!-- HUD -->
  <div id="hud">
    <!-- Top bar -->
    <div id="top-bar">
      <div id="zone-lbl">📍 Campus</div>
      <div id="time-lbl">☀️ 08:00</div>
    </div>

    <!-- Health & ammo -->
    <div id="stats">
      <div id="hp-bar">
        <span>❤️</span>
        <div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%;background:#22cc44"></div></div>
        <span id="hp-txt">100</span>
      </div>
      <div id="ammo-box">
        <span>🔫</span><span id="ammo-txt">30 / 90</span>
      </div>
    </div>

    <!-- Crosshair -->
    <div id="xhair">
      <div class="xh xh-t"></div>
      <div class="xh xh-b"></div>
      <div class="xh xh-l"></div>
      <div class="xh xh-r"></div>
      <div class="xh xh-c"></div>
    </div>

    <!-- Kill / hit feed -->
    <div id="killfeed"></div>

    <!-- Interact hint -->
    <div id="hint">🚪 Tap to Enter</div>

    <!-- Reload hint -->
    <div id="reload-hint">Press R to Reload</div>
  </div>

  <!-- SETTINGS BTN -->
  <button id="sbtn" title="Menu">☰</button>

  <!-- PAUSE MENU -->
  <div id="pause-menu">
    <div class="pm-box">
      <h2>⏸ PAUSED</h2>
      <button id="pm-resume">▶ Resume</button>
      <div class="pm-row">
        <label>Sensitivity</label>
        <input type="range" id="sl-sens" min="0.5" max="5" step="0.1" value="2"/>
        <span id="sv-sens">2.0</span>
      </div>
      <div class="pm-row">
        <label>Speed</label>
        <input type="range" id="sl-spd" min="0.5" max="3" step="0.1" value="1"/>
        <span id="sv-spd">1.0</span>
      </div>
      <div class="pm-row">
        <label>Volume</label>
        <input type="range" id="sl-vol" min="0" max="1" step="0.05" value="0.5"/>
        <span id="sv-vol">50%</span>
      </div>
      <div class="pm-row">
        <label>Graphics</label>
        <select id="sl-gfx">
          <option value="low">Low</option>
          <option value="med" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
  </div>

  <!-- MINIMAP -->
  <div id="mmap-wrap">
    <canvas id="mmap" width="160" height="160"></canvas>
  </div>

  <!-- ROOM CARD -->
  <div id="room-overlay">
    <div id="room-card">
      <div id="rm-icon">🏫</div>
      <h2 id="rm-title">Room</h2>
      <p id="rm-desc">…</p>
      <button id="rm-close">Exit</button>
    </div>
  </div>

  <!-- PWA INSTALL BANNER -->
  <div id="pwa-banner">
    <span>📲 Install as App for fullscreen!</span>
    <button id="pwa-install">Install</button>
    <button id="pwa-dismiss">✕</button>
  </div>

  <!-- MOBILE CONTROLS -->
  <div id="mobile-ui">
    <!-- Left joystick -->
    <div id="joy-zone">
      <div id="joy-ring"></div>
      <div id="joy-dot"></div>
    </div>
    <!-- Right side buttons -->
    <div id="right-btns">
      <button class="rbtn" id="btn-fire">🔫</button>
      <button class="rbtn" id="btn-jump">⬆</button>
      <button class="rbtn" id="btn-reload">R</button>
      <button class="rbtn" id="btn-sprint">💨</button>
    </div>
  </div>

  <!-- DESKTOP HINT -->
  <div id="dsk-hint">WASD Move · Mouse Look · LMB Shoot · R Reload · Shift Sprint · Space Jump · E Enter · ESC Menu</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
